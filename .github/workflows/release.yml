name: Release

# Creates a GitHub release (and tag) whenever the version in manifest.json
# changes on main. Bump the version, push, done.
on:
  push:
    branches: [main]
    paths:
      - custom_components/solar_cockpit/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "version=$(jq -r .version custom_components/solar_cockpit/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" \
              --title "Solar Cockpit $VERSION" --generate-notes
          fi
