name: One-time release cleanup

# Run once by hand after the history rewrite: removes all old releases and
# tags (they point to the old history) and publishes the current version.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete old releases and tags, publish current version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            gh release delete "$tag" --yes --cleanup-tag || true
          done
          for tag in $(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags" --jq '.[].ref' | sed 's#refs/tags/##'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" || true
          done
          VERSION=$(jq -r .version custom_components/solar_cockpit/manifest.json)
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Solar Cockpit $VERSION" \
            --notes "PV, battery, grid and cost overview for Home Assistant with its own energy-flow card in nine styles (light/dark, English/German). See the README for setup and the changelog."
